[package]
name = "dhrust"
version = "0.2.0"
edition = "2021"
authors = ["Berin <100538511@qq.com>", "湖北登灏科技有限公司 <dingchuan@deng-hao.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 时间文本格式/解析（与 C# 兼容的 yyyy-MM-dd HH:mm:ss 系列）
chrono = "0.4"
# MD5 摘要（NewLife `MD5()` 扩展等价实现）
md-5 = "0.10"
rand = "0.8.5"
sha1 = "0.10.5"
# 配置序列化（JSON 配置读写，与 C# JsonConfigProvider 对应）
serde = { version = "1", features = ["derive"] }
# preserve_order：保持字段声明顺序，生成与 C# 一致的配置文件
serde_json = { version = "1", features = ["preserve_order"] }
# XML 配置读取（与 C# XmlConfigProvider 生成的文件互通）
quick-xml = "0.36"

[features]
# Razor 子集模板引擎（方案 C，零新依赖；规约见 Doc/Razor子集模板引擎架构.md）
razor = []

[profile.release]
# 发布构建启用全量 LTO 与单代码元：模板引擎等热路径可跨模块内联（基准见 tools/bench-view）
lto = true
codegen-units = 1

[dev-dependencies]
# 集成测试（tests/razor_cases.rs）读取用例数据；与主依赖同 crate 同版本（零新增供应链）
serde_json = { version = "1", features = ["preserve_order"] }