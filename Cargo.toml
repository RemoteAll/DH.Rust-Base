[package]
name = "dhrust"
version = "0.2.0"
edition = "2021"
authors = ["Berin <100538511@qq.com>", "湖北登灏科技有限公司 <dingchuan@deng-hao.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 时间文本格式/解析（与 C# 兼容的 yyyy-MM-dd HH:mm:ss 系列）
chrono = "0.4"
# MD5 摘要（NewLife `MD5()` 扩展等价实现）
md-5 = "0.10"
rand = "0.8.5"
sha1 = "0.10.5"
# 配置序列化（JSON 配置读写，与 C# JsonConfigProvider 对应）
serde = { version = "1", features = ["derive"] }
# preserve_order：保持字段声明顺序，生成与 C# 一致的配置文件
serde_json = { version = "1", features = ["preserve_order"] }
# XML 配置读取（与 C# XmlConfigProvider 生成的文件互通）
quick-xml = "0.36"

# ———— feature `toml`（TOML 配置维护管线：保注释补齐/类型修正回写/未知项识别/备份写入）————
toml = { version = "1", optional = true }
toml_edit = { version = "0.25", optional = true }

# ———— feature `http-client` / `net`（DHDeploy.Agent Rust 迁移网络内核；版本与 bench-net 已验证一致）————
# 运行时（多线程调度/网络/定时/同步）
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"], optional = true }
# HTTP 服务端/客户端（连接层；语义层（路由/上下文）在 dhrust::net::http 自研）
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
# Tokio IO 适配
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# 响应体工具
http-body-util = { version = "0.1", optional = true }
# WebSocket 帧层（Apache-2.0，小体量可 fork；会话/心跳/重连语义在 dhrust::net::ws 自研）
# unstable-split：读写半部分离（客户端读任务/写任务结构，见 src/net/ws.rs）
fastwebsockets = { version = "0.8", optional = true, features = ["unstable-split"] }
# TLS（wss；rustls + ring——迁移文档选型：性能优、可 zig 交叉编 musl）
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }
# PEM 证书/私钥解析（HTTPS 服务端证书加载）
rustls-pemfile = { version = "2", optional = true }
# 自签证书生成（Agent HTTPS 监听开箱即用；纯 Rust，ring 后端）
rcgen = { version = "0.13", optional = true, default-features = false, features = ["pem", "ring"] }

[features]
# TOML 配置维护管线（tcp-scanner-server 实践沉淀；启用后提供 config::toml 模块）
toml = ["dep:toml", "dep:toml_edit"]
# Razor 子集模板引擎（方案 C，零新依赖；规约见 Doc/Razor子集模板引擎架构.md）
razor = []
# STUN 服务（RFC 5389 Binding；UDP，仅依赖 tokio；net 特性自动包含）
stun = ["dep:tokio"]
# HTTP 客户端（hyper 连接层 + tokio；tcp-scanner-server 等“仅需 client”的消费方使用）
http-client = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# 网络内核（DHDeploy.Agent Rust 迁移；选型与红线见 DHDeploy 仓库 Doc/网络层选型复核.md）
net = ["http-client", "dep:fastwebsockets", "stun"]
# wss/TLS（在 net 之上追加；根证书优先系统存储，为空时回退 webpki-roots）
net-tls = [
    "net",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
    "dep:rustls-pemfile",
    "dep:rcgen",
]

[profile.release]
# 发布构建启用全量 LTO 与单代码元：模板引擎等热路径可跨模块内联（基准见 tools/bench-view）
lto = true
codegen-units = 1

[dev-dependencies]
# 集成测试（tests/razor_cases.rs）读取用例数据；与主依赖同 crate 同版本（零新增供应链）
serde_json = { version = "1", features = ["preserve_order"] }