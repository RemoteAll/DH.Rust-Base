[package]
name = "dhrust"
version = "0.5.1"
edition = "2021"
authors = ["Berin <100538511@qq.com>", "婀栧寳鐧荤亸绉戞妧鏈夐檺鍏徃 <dingchuan@deng-hao.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 鏃堕棿鏂囨湰鏍煎紡/瑙ｆ瀽锛堜笌 C# 鍏煎鐨?yyyy-MM-dd HH:mm:ss 绯诲垪锛?
chrono = "0.4"
# MD5 鎽樿锛圢ewLife `MD5()` 鎵╁睍绛変环瀹炵幇锛?
md-5 = "0.10"
rand = "0.8.5"
sha1 = "0.10.5"
# SHA-256 / HMAC-SHA256锛圓gent 浠ょ墝鏍￠獙涓庣鍚嶏紱RustCrypto 鍚屾棌锛屼笌 md-5/sha1 涓€鑷达級
sha2 = "0.10"
hmac = "0.12"
# Base64 缂栬В鐮侊紙鏍囧噯涓?URL 瀹夊叏锛涗护鐗?绛惧悕/浼犺緭鍦烘櫙锛?
base64 = "0.22"
# 鍙€嗗姞瀵嗭紙AES-256-GCM锛沠eature `secret`锛夆€斺€擱ustCrypto 鍚屾棌锛岀函 Rust銆佸彲 zig 浜ゅ弶缂?musl
aes-gcm = { version = "0.10", optional = true }
# 閰嶇疆搴忓垪鍖栵紙JSON 閰嶇疆璇诲啓锛屼笌 C# JsonConfigProvider 瀵瑰簲锛?
serde = { version = "1", features = ["derive"] }
# preserve_order锛氫繚鎸佸瓧娈靛０鏄庨『搴忥紝鐢熸垚涓?C# 涓€鑷寸殑閰嶇疆鏂囦欢
serde_json = { version = "1", features = ["preserve_order"] }
# XML 閰嶇疆璇诲彇锛堜笌 C# XmlConfigProvider 鐢熸垚鐨勬枃浠朵簰閫氾級
quick-xml = "0.36"

# 鈥斺€斺€斺€?feature `plugin`锛堟彃浠跺寘鏍煎紡 + 鎻掍欢婧愮洰褰?Ed25519 绛惧悕锛汸ek.RAgent 鈫?Pek.RPanlServer 鍏辩敤锛夆€斺€斺€斺€?
ed25519-dalek = { version = "2", optional = true }

# 鈥斺€斺€斺€?feature `toml`锛圱OML 閰嶇疆缁存姢绠＄嚎锛氫繚娉ㄩ噴琛ラ綈/绫诲瀷淇鍥炲啓/鏈煡椤硅瘑鍒?澶囦唤鍐欏叆锛夆€斺€斺€斺€?
toml = { version = "1", optional = true }
toml_edit = { version = "0.25", optional = true }

# 鈥斺€斺€斺€?feature `zip-extract`锛圸IP 瑙ｅ帇锛涚増鏈?鐗规€т笌 Pek.RAgent 涓€鑷达級鈥斺€斺€斺€?
# 涓婃父鎶?`zip` 鍘嗗彶鐗堟湰**鍑犱箮鍏ㄩ儴 yank**锛坈rates.io 绱㈠紩閲屼粎 9.0.3 / 9.0.4 闈?yanked锛夛紱
# 鍋滃湪 `^2` 鏃舵棦鏈夐」鐩潬 Cargo.lock 閲屽凡閿佺殑 2.4.2 浠嶅彲缁紪锛屼絾**鏂板缓椤圭洰**瑙ｆ瀽渚濊禆浼氬け璐?
# 锛坄failed to select a version for the requirement zip = "^2"`锛夈€傛晠瀵归綈涓婃父鍞竴鍙敤绾?9.x
# 锛坺ip 鏂囦欢鏍煎紡鍚戜笅鍏煎锛岃鍐欎簰閫氾紱2026-10-16 鐢?2.x 鍗囩骇锛夈€?
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

# 鈥斺€斺€斺€?feature `patch`锛坺std 瀛楀吀宸垎琛ヤ竵锛氫互鏃ф枃浠朵负瀛楀吀鍘嬬缉鏂版枃浠讹紱澧為噺鍗囩骇锛孭ek.RAgent 鈫?DHDeploy.Agent.Rust 鍏辩敤锛夆€斺€斺€斺€?
zstd = { version = "0.13", optional = true }

# 鈥斺€斺€斺€?feature `http-client` / `net`锛圖HDeploy.Agent Rust 杩佺Щ缃戠粶鍐呮牳锛涚増鏈笌 bench-net 宸查獙璇佷竴鑷达級鈥斺€斺€斺€?
# 杩愯鏃讹紙澶氱嚎绋嬭皟搴?缃戠粶/瀹氭椂/鍚屾锛?
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"], optional = true }
# HTTP 鏈嶅姟绔?瀹㈡埛绔紙杩炴帴灞傦紱璇箟灞傦紙璺敱/涓婁笅鏂囷級鍦?dhrust::net::http 鑷爺锛?
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
# Tokio IO 閫傞厤
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# 鍝嶅簲浣撳伐鍏?
http-body-util = { version = "0.1", optional = true }
# 鍝嶅簲鍘嬬缉锛坓zip锛沶et 鐗规€у唴寤衡€斺€旈潰鏉?HTML/JSON 杞鍑虹綉娴侀噺鍓婂噺锛?
# 绾?Rust 鍚庣锛坢iniz_oxide锛夛紝鍙叏骞冲彴 zig 浜ゅ弶缂栬瘧锛?
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
# WebSocket 甯у眰锛圓pache-2.0锛屽皬浣撻噺鍙?fork锛涗細璇?蹇冭烦/閲嶈繛璇箟鍦?dhrust::net::ws 鑷爺锛?
# unstable-split锛氳鍐欏崐閮ㄥ垎绂伙紙瀹㈡埛绔浠诲姟/鍐欎换鍔＄粨鏋勶紝瑙?src/net/ws.rs锛?
fastwebsockets = { version = "0.8", optional = true, features = ["unstable-split"] }
# TLS锛坵ss锛況ustls + ring鈥斺€旇縼绉绘枃妗ｉ€夊瀷锛氭€ц兘浼樸€佸彲 zig 浜ゅ弶缂?musl锛?
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }
# PEM 璇佷功/绉侀挜瑙ｆ瀽锛圚TTPS 鏈嶅姟绔瘉涔﹀姞杞斤級
rustls-pemfile = { version = "2", optional = true }
# 鑷璇佷功鐢熸垚锛圓gent HTTPS 鐩戝惉寮€绠卞嵆鐢紱绾?Rust锛宺ing 鍚庣锛?
rcgen = { version = "0.13", optional = true, default-features = false, features = ["pem", "ring"] }

[target.'cfg(unix)'.dependencies]
# 杩涚▼绠＄悊/绯荤粺閲囬泦锛歴ignal銆乻ysconf銆乻tatvfs銆乵alloc_trim銆乧lock_settime 绛?
libc = "0.2"
# 鐪?PTY锛坱erm 鐗规€э紱openpty锛?.9 鐨?nix 0.28 鏀寔 loongarch64 绛夊叏鏋舵瀯浜ゅ弶缂栬瘧锛?
portable-pty = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
# 鐪?PTY锛坱erm 鐗规€э紱ConPTY锛夆€斺€?.8锛氬疄娴嬪彲鐢紙0.9 鐨?PSUEDOCONSOLE_INHERIT_CURSOR 鏍囧織涓嬫棤杈撳嚭锛?
portable-pty = { version = "0.8", optional = true }
# 绯荤粺杩愯鏃堕暱锛堟棩蹇楀ご `#SystemStarted`锛屽榻?C# Environment.TickCount64 鈫?GetTickCount64锛?
# 缃戝崱绱娴侀噺锛坰ys::net::net_totals 鈫?GetIfTable2锛汭pHelper + Ndis + WinSock锛?
# 杩涚▼绠＄悊/鎸囨爣閲囬泦锛坰ys::process / sys::monitor锛夛細Threading銆丳rocessStatus銆乀oolHelp
# 鏈哄櫒浜嬪疄锛坰ys::machine锛夛細Registry锛圕PU 鍨嬪彿/MachineGuid锛夈€丼torage_FileSystem锛堢鐩橈級
# Security/IO锛堟牎鏃剁壒鏉冦€佺鐩?IOCTL锛汣reateFileW 渚濊禆 Security锛?
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
# Windows 鏈嶅姟杩愯鏃讹紙service 鐗规€э細涓?SCM 浜や簰 StartServiceCtrlDispatcher/HandlerEx/SetServiceStatus锛?
# 鐗堟湰涓?Pek.RAgent 涓€鑷达級
windows-service = { version = "0.7", optional = true }

[features]
# TOML 閰嶇疆缁存姢绠＄嚎锛坱cp-scanner-server 瀹炶返娌夋穩锛涘惎鐢ㄥ悗鎻愪緵 config::toml 妯″潡锛?
toml = ["dep:toml", "dep:toml_edit"]
# Razor 瀛愰泦妯℃澘寮曟搸锛堟柟妗?C锛岄浂鏂颁緷璧栵紱瑙勭害瑙?Doc/Razor瀛愰泦妯℃澘寮曟搸鏋舵瀯.md锛?
razor = []
# 鍙€嗗姞瀵嗭紙AES-256-GCM锛涢厤缃腑鏁忔劅鍊尖€滈槻鐩磋鈥濆瓨鍌紝濡傜櫥褰曞瘑鐮佲€斺€擧lkProductTool 瀹炶返娌夋穩锛?
secret = ["dep:aes-gcm"]
# 璺ㄥ钩鍙版湇鍔＄鐞嗭紙Windows SCM / systemd / procd / SysV / launchd锛汸ek.RAgent 涓嬫矇锛?
service = ["dep:windows-service"]
# ZIP 瑙ｅ帇锛堥槻鐩綍绌胯秺/鍗犵敤鏂囦欢瀹夊叏鏇挎崲锛汸ek.RAgent 涓?DHDeploy.Agent 鍏辩敤锛?
zip-extract = ["dep:zip"]
# 鏂囦欢绠＄悊锛堥潰鏉挎祻瑙?涓婁紶涓嬭浇/缂栬緫/鍘嬬缉瑙ｅ帇/鎼滅储锛汸ek.RAgent 涓?Pek.RPanlServer 鍏辩敤锛?
fileman = ["zip-extract"]
# zstd 瀛楀吀宸垎琛ヤ竵锛堝閲忓崌绾э細鐢熸垚/杩樺師锛汸ek.RAgent 涓?DHDeploy.Agent.Rust 鍏辩敤锛?
patch = ["dep:zstd"]
# 鎻掍欢鍖呮牸寮?+ 鎻掍欢婧愮洰褰曠鍚嶏紙Ed25519锛涘惈 zip-extract锛夆€斺€擯ek.RAgent锛堝畨瑁?鍙戝竷锛変笌 Pek.RPanlServer锛堝钩鍙帮級鍏辩敤
plugin = ["zip-extract", "dep:ed25519-dalek"]
# 鐪?PTY 浼氳瘽寮曟搸锛圵indows ConPTY / Unix openpty锛涘湪绾跨粓绔瓑鏈嶅姟绔兘鍔涘叡鐢級
term = ["dep:portable-pty"]
# STUN 鏈嶅姟锛圧FC 5389 Binding锛沀DP锛屼粎渚濊禆 tokio锛沶et 鐗规€ц嚜鍔ㄥ寘鍚級
stun = ["dep:tokio"]
# MQTT 瀹㈡埛绔紙MQTT 3.1.1锛氳繛鎺ヨ璇?/ QoS0路1 鍙戝竷 / 淇濇椿 / 鏂嚎閲嶈繛锛?
# tcp-scanner-server 瀵规帴 WMSMqttServer 鐜板満鏀剁紪锛?
mqtt = ["dep:tokio"]
# HTTP 瀹㈡埛绔紙hyper 杩炴帴灞?+ tokio锛泃cp-scanner-server 绛夆€滀粎闇€ client鈥濈殑娑堣垂鏂逛娇鐢級
http-client = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# HTTPS 瀹㈡埛绔?TLS锛堝湪 http-client 涔嬩笂杩藉姞锛涗笉鎵?WS/鏈嶅姟绔瘉涔﹀伐鍏封€斺€斾紒涓氬井淇℃帹閫佺瓑 config 椹卞姩鍦烘櫙锛?
# 鏍硅瘉涔︿紭鍏堢郴缁熷瓨鍌紝涓虹┖鏃跺洖閫€ webpki-roots
http-tls = [
    "http-client",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
    "dep:rustls-pemfile",
]
# 缃戠粶鍐呮牳锛圖HDeploy.Agent Rust 杩佺Щ锛涢€夊瀷涓庣孩绾胯 DHDeploy 浠撳簱 Doc/缃戠粶灞傞€夊瀷澶嶆牳.md锛?
net = ["http-client", "dep:fastwebsockets", "stun", "dep:flate2"]
# wss/TLS锛堝湪 net 涔嬩笂杩藉姞锛涘惈 HTTPS 瀹㈡埛绔笌鏈嶅姟绔瘉涔﹁兘鍔涳級
net-tls = [
    "net",
    "http-tls",
    "dep:rustls-pemfile",
    "dep:rcgen",
]

[profile.release]
# 鍙戝竷鏋勫缓鍚敤鍏ㄩ噺 LTO 涓庡崟浠ｇ爜鍏冿細妯℃澘寮曟搸绛夌儹璺緞鍙法妯″潡鍐呰仈锛堝熀鍑嗚 tools/bench-view锛?
lto = true
