[package]
name = "dhrust"
version = "0.2.0"
edition = "2021"
authors = ["Berin <100538511@qq.com>", "湖北登灏科技有限公司 <dingchuan@deng-hao.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# 时间文本格式/解析（与 C# 兼容的 yyyy-MM-dd HH:mm:ss 系列）
chrono = "0.4"
# MD5 摘要（NewLife `MD5()` 扩展等价实现）
md-5 = "0.10"
rand = "0.8.5"
sha1 = "0.10.5"
# SHA-256 / HMAC-SHA256（Agent 令牌校验与签名；RustCrypto 同族，与 md-5/sha1 一致）
sha2 = "0.10"
hmac = "0.12"
# Base64 编解码（标准与 URL 安全；令牌/签名/传输场景）
base64 = "0.22"
# 可逆加密（AES-256-GCM；feature `secret`）——RustCrypto 同族，纯 Rust、可 zig 交叉编 musl
aes-gcm = { version = "0.10", optional = true }
# 配置序列化（JSON 配置读写，与 C# JsonConfigProvider 对应）
serde = { version = "1", features = ["derive"] }
# preserve_order：保持字段声明顺序，生成与 C# 一致的配置文件
serde_json = { version = "1", features = ["preserve_order"] }
# XML 配置读取（与 C# XmlConfigProvider 生成的文件互通）
quick-xml = "0.36"

# ———— feature `toml`（TOML 配置维护管线：保注释补齐/类型修正回写/未知项识别/备份写入）————
toml = { version = "1", optional = true }
toml_edit = { version = "0.25", optional = true }

# ———— feature `http-client` / `net`（DHDeploy.Agent Rust 迁移网络内核；版本与 bench-net 已验证一致）————
# 运行时（多线程调度/网络/定时/同步）
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"], optional = true }
# HTTP 服务端/客户端（连接层；语义层（路由/上下文）在 dhrust::net::http 自研）
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
# Tokio IO 适配
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# 响应体工具
http-body-util = { version = "0.1", optional = true }
# WebSocket 帧层（Apache-2.0，小体量可 fork；会话/心跳/重连语义在 dhrust::net::ws 自研）
# unstable-split：读写半部分离（客户端读任务/写任务结构，见 src/net/ws.rs）
fastwebsockets = { version = "0.8", optional = true, features = ["unstable-split"] }
# TLS（wss；rustls + ring——迁移文档选型：性能优、可 zig 交叉编 musl）
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }
# PEM 证书/私钥解析（HTTPS 服务端证书加载）
rustls-pemfile = { version = "2", optional = true }
# 自签证书生成（Agent HTTPS 监听开箱即用；纯 Rust，ring 后端）
rcgen = { version = "0.13", optional = true, default-features = false, features = ["pem", "ring"] }

[target.'cfg(unix)'.dependencies]
# 进程管理/系统采集：signal、sysconf、statvfs、malloc_trim、clock_settime 等
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 系统运行时长（日志头 `#SystemStarted`，对齐 C# Environment.TickCount64 → GetTickCount64）
# 网卡累计流量（sys::net::net_totals → GetIfTable2；IpHelper + Ndis + WinSock）
# 进程管理/指标采集（sys::process / sys::monitor）：Threading、ProcessStatus、ToolHelp
# 机器事实（sys::machine）：Registry（CPU 型号/MachineGuid）、Storage_FileSystem（磁盘）
# Security/IO（校时特权、磁盘 IOCTL；CreateFileW 依赖 Security）
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[features]
# TOML 配置维护管线（tcp-scanner-server 实践沉淀；启用后提供 config::toml 模块）
toml = ["dep:toml", "dep:toml_edit"]
# Razor 子集模板引擎（方案 C，零新依赖；规约见 Doc/Razor子集模板引擎架构.md）
razor = []
# 可逆加密（AES-256-GCM；配置中敏感值“防直读”存储，如登录密码——HlkProductTool 实践沉淀）
secret = ["dep:aes-gcm"]
# STUN 服务（RFC 5389 Binding；UDP，仅依赖 tokio；net 特性自动包含）
stun = ["dep:tokio"]
# MQTT 客户端（MQTT 3.1.1：连接认证 / QoS0·1 发布 / 保活 / 断线重连；
# tcp-scanner-server 对接 WMSMqttServer 现场收编）
mqtt = ["dep:tokio"]
# HTTP 客户端（hyper 连接层 + tokio；tcp-scanner-server 等“仅需 client”的消费方使用）
http-client = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# HTTPS 客户端 TLS（在 http-client 之上追加；不打 WS/服务端证书工具——企业微信推送等 config 驱动场景）
# 根证书优先系统存储，为空时回退 webpki-roots
http-tls = [
    "http-client",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]
# 网络内核（DHDeploy.Agent Rust 迁移；选型与红线见 DHDeploy 仓库 Doc/网络层选型复核.md）
net = ["http-client", "dep:fastwebsockets", "stun"]
# wss/TLS（在 net 之上追加；含 HTTPS 客户端与服务端证书能力）
net-tls = [
    "net",
    "http-tls",
    "dep:rustls-pemfile",
    "dep:rcgen",
]

[profile.release]
# 发布构建启用全量 LTO 与单代码元：模板引擎等热路径可跨模块内联（基准见 tools/bench-view）
lto = true
codegen-units = 1

[dev-dependencies]
# 集成测试（tests/razor_cases.rs）读取用例数据；与主依赖同 crate 同版本（零新增供应链）
serde_json = { version = "1", features = ["preserve_order"] }